name: build-image
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [Dockerfile, .github/workflows/build-image.yml]
permissions:
  contents: read
  packages: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/barker59/pearl-srb:3.8.3
            ghcr.io/barker59/pearl-srb:latest
